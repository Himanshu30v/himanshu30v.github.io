<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Himanshu's Real Portfolio — Cinematic Reel Recorder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #060112;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Top Recording Control Bar */
        .record-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(15, 8, 30, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(124, 58, 237, 0.3);
        }

        .record-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #c084fc;
        }

        .record-title .dot {
            width: 10px;
            height: 10px;
            background: #ec4899;
            border-radius: 50%;
            box-shadow: 0 0 10px #ec4899;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .btn-rec {
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: all 0.3s;
        }

        .btn-start {
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            color: #ffffff;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.5);
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(236, 72, 153, 0.6);
        }

        .btn-stop {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
            display: none;
        }

        .mode-select {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            cursor: pointer;
        }

        .mode-select option {
            background: #0f0820;
            color: #fff;
        }

        /* Mockup Frame Container */
        .stage-container {
            margin-top: 100px;
            margin-bottom: 50px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* 9:16 Vertical Phone Mode */
        .stage-container.mode-reel {
            width: 430px;
            height: 932px;
            border-radius: 48px;
            border: 8px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 50px rgba(124, 58, 237, 0.4);
            overflow: hidden;
            position: relative;
            background: #030014;
        }

        /* 16:9 Desktop Mode */
        .stage-container.mode-desktop {
            width: 1200px;
            height: 750px;
            border-radius: 24px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9), 0 0 50px rgba(124, 58, 237, 0.4);
            overflow: hidden;
            position: relative;
            background: #030014;
        }

        /* Actual Live Portfolio Frame */
        #portfolioFrame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #030014;
        }

        /* Synthetic Glowing Cursor for Video */
        #fakeCursor {
            position: absolute;
            top: 0;
            left: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(236, 72, 153, 0.9);
            box-shadow: 0 0 20px #ec4899, 0 0 40px #7c3aed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s;
            opacity: 0;
        }

        #fakeCursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #ffffff;
            border-radius: 50%;
        }

        /* Video Status Overlay */
        .status-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 999999;
        }
    </style>
</head>
<body>

    <!-- Recording Control Bar -->
    <div class="record-bar">
        <div class="record-title">
            <span class="dot"></span>
            Real Portfolio Video Studio
        </div>

        <select class="mode-select" id="formatSelect" onchange="changeFormat(this.value)">
            <option value="reel">📱 9:16 Instagram Reel Format</option>
            <option value="desktop">💻 16:9 Desktop Wide Format</option>
        </select>

        <select class="mode-select" id="speedSelect">
            <option value="20">⏱️ 20 Seconds Reel</option>
            <option value="15">⚡ 15 Seconds Fast Reel</option>
            <option value="30">🎬 30 Seconds Detailed Tour</option>
        </select>

        <button class="btn-rec btn-start" id="startBtn" onclick="startCinematicTour()">
            <i class="fas fa-video"></i> Start & Record Video
        </button>

        <button class="btn-rec btn-stop" id="stopBtn" onclick="stopRecordingManually()">
            <i class="fas fa-stop"></i> Stop & Download
        </button>
    </div>

    <!-- Live Website Stage Mockup -->
    <div class="stage-container mode-reel" id="stage">
        <div id="fakeCursor"></div>
        <iframe id="portfolioFrame" src="index.html"></iframe>
    </div>

    <div class="status-toast" id="statusToast">
        ✅ Real Portfolio Video Downloaded Successfully!
    </div>

    <script>
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let animationTimer = null;

        function changeFormat(mode) {
            const stage = document.getElementById('stage');
            stage.className = 'stage-container mode-' + mode;
        }

        async function startCinematicTour() {
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const duration = parseInt(document.getElementById('speedSelect').value);
            const frame = document.getElementById('portfolioFrame');
            const frameWin = frame.contentWindow;
            const fakeCursor = document.getElementById('fakeCursor');

            // 1. Capture Screen Stream for Real Video
            let stream = null;
            try {
                // Request tab or window capture with highest quality
                stream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        displaySurface: "browser",
                        frameRate: 60
                    },
                    audio: false,
                    preferCurrentTab: true
                });
            } catch (err) {
                alert("Please allow tab/screen recording permission so your browser can export the video file!");
                return;
            }

            // Start MediaRecorder
            recordedChunks = [];
            let mimeType = 'video/webm;codecs=vp9';
            if (!MediaRecorder.isTypeSupported(mimeType)) {
                mimeType = 'video/webm;codecs=vp8';
                if (!MediaRecorder.isTypeSupported(mimeType)) {
                    mimeType = 'video/webm';
                }
            }

            mediaRecorder = new MediaRecorder(stream, {
                mimeType: mimeType,
                videoBitsPerSecond: 15000000 // 15 Mbps Ultra HD
            });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'himanshu-real-portfolio-video.webm';
                a.click();

                // Stop all stream tracks
                stream.getTracks().forEach(track => track.stop());

                const toast = document.getElementById('statusToast');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 4000);

                startBtn.style.display = 'inline-flex';
                stopBtn.style.display = 'none';
                fakeCursor.style.opacity = '0';
            };

            mediaRecorder.start();
            isRecording = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-flex';
            fakeCursor.style.opacity = '1';

            // 2. Perform Automated Smooth Cinematic Scroll of the REAL portfolio
            const maxScroll = frameWin.document.documentElement.scrollHeight - frameWin.innerHeight;
            const startTime = performance.now();
            const totalDurationMs = duration * 1000;

            // Smooth scroll function
            function step(timestamp) {
                const elapsed = timestamp - startTime;
                const progress = Math.min(1, elapsed / totalDurationMs);

                // Smooth cubic ease-in-out scroll
                const easeProgress = progress < 0.5 
                    ? 4 * progress * progress * progress 
                    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

                const currentScrollY = easeProgress * maxScroll;
                frameWin.scrollTo(0, currentScrollY);

                // Synthetic cursor movement
                const stageRect = document.getElementById('stage').getBoundingClientRect();
                const cursorX = stageRect.width * (0.5 + Math.sin(elapsed / 800) * 0.35);
                const cursorY = stageRect.height * (0.35 + Math.cos(elapsed / 1200) * 0.25);
                fakeCursor.style.left = cursorX + 'px';
                fakeCursor.style.top = cursorY + 'px';

                if (progress < 1 && isRecording) {
                    animationTimer = requestAnimationFrame(step);
                } else {
                    setTimeout(() => {
                        stopRecordingManually();
                    }, 800);
                }
            }

            animationTimer = requestAnimationFrame(step);
        }

        function stopRecordingManually() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (animationTimer) cancelAnimationFrame(animationTimer);
            isRecording = false;
        }
    </script>
</body>
</html>
